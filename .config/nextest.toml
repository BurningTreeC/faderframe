# CI and Ports run `cargo nextest run --workspace --profile ci`.
[profile.ci]
# Real-time tests (the dummy device, paced render-ahead, network streams)
# can miss a deadline on a shared runner: a failure is tried twice more.
retries = 2
fail-fast = false
# Needs a quiet machine: on a shared runner a few frames of the circle come
# back short of full level (132 of 144 636 on GitHub's, none on a
# workstation; no frame lost or repeated).
default-filter = "not test(=streams_join_another_device_as_followers)"
