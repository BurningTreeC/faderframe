[package]
name = "faderframe-plugin-sandbox"
description = "Plugins in helper processes: a crashing plugin does not take FaderFrame down"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
faderframe-audio-graph.workspace = true
faderframe-automation.workspace = true
faderframe-core.workspace = true
faderframe-midi.workspace = true
faderframe-plugin-host.workspace = true
faderframe-realtime.workspace = true
faderframe-timeline.workspace = true
faderframe-transport.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
faderframe-audio-files.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSDate", "NSGeometry", "NSObjCRuntime", "NSRunLoop", "NSString"] }
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSEvent", "NSGraphics", "NSResponder", "NSRunningApplication", "NSView", "NSWindow"] }
