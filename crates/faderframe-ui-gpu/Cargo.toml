[package]
name = "faderframe-ui-gpu"
description = "GPU painter (vello on wgpu) for dense custom views"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
faderframe-ui-canvas.workspace = true
vello = "0.11"
parley = "0.11"
pollster = "0.4"
png = "0.18"
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Dmabuf export through wgpu's Vulkan backend (the versions vello's wgpu
# uses).
wgpu = { version = "30", default-features = false, features = ["vulkan", "std", "wgsl"] }
ash = "0.38"

[target.'cfg(windows)'.dependencies]
# Shared D3D12 textures through wgpu's DX12 backend (the windows crate
# version wgpu-hal uses).
wgpu = { version = "30", default-features = false, features = ["dx12", "std", "wgsl"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
] }
