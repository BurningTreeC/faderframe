[package]
name = "faderframe-ui"
description = "GTK 4 application shell, docking and canvas widget host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["gpu-painter"]
# Steinberg ASIO drivers on Windows (see faderframe-audio-cpal).
asio = ["faderframe-audio-cpal/asio"]
# Dense views (analysers, meters, curves) drawn on the GPU when the
# preference is on (see faderframe-ui-gpu).
gpu-painter = ["dep:faderframe-ui-gpu"]

[dependencies]
faderframe-plugin-clap.workspace = true
faderframe-plugin-vst3.workspace = true
faderframe-plugin-sandbox.workspace = true
faderframe-plugin-host.workspace = true
gtk.workspace = true
faderframe-core.workspace = true
faderframe-automation.workspace = true
faderframe-project.workspace = true
faderframe-workspace.workspace = true
faderframe-session.workspace = true
faderframe-audio.workspace = true
faderframe-audio-cpal.workspace = true
faderframe-ui-canvas.workspace = true
faderframe-view-ddp.workspace = true
faderframe-view-surround.workspace = true
faderframe-adm.workspace = true
faderframe-binaural.workspace = true
faderframe-iamf.workspace = true
faderframe-ui-gpu = { workspace = true, optional = true }
faderframe-view-arranger.workspace = true
faderframe-view-mixer.workspace = true
faderframe-view-performance.workspace = true
faderframe-view-history.workspace = true
faderframe-view-leadsheet.workspace = true
faderframe-view-events.workspace = true
faderframe-view-adr.workspace = true
faderframe-view-video.workspace = true
faderframe-video.workspace = true
faderframe-view-modulators.workspace = true
faderframe-view-pitch.workspace = true
faderframe-view-clipfx.workspace = true
faderframe-view-launcher.workspace = true
faderframe-view-tools.workspace = true
faderframe-view-devices.workspace = true
faderframe-view-automation.workspace = true
faderframe-view-album.workspace = true
faderframe-view-pianoroll.workspace = true
faderframe-timeline.workspace = true
faderframe-transport.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
faderframe-engine.workspace = true
faderframe-audio-files.workspace = true

[target.'cfg(unix)'.dependencies]
glib-unix.workspace = true

# Plugin editor parent windows: X11 (Linux/BSD), Win32, Cocoa.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb.workspace = true

[target.'cfg(windows)'.dependencies]
# Shared D3D12 textures to GTK's Vulkan renderer (GTK 4.20).
gdk4-win32 = { version = "0.11", features = ["v4_20"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_OpenGL", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
faderframe-plugin-au.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSGeometry", "NSString"] }
objc2-app-kit = { workspace = true, features = ["NSGraphics", "NSResponder", "NSScreen", "NSView", "NSWindow"] }

# Audio servers of Linux desktops.
[target.'cfg(target_os = "linux")'.dependencies]
faderframe-audio-jack.workspace = true
faderframe-audio-pipewire.workspace = true
faderframe-plugin-lv2.workspace = true
