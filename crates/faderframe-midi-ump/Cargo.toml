[package]
name = "faderframe-midi-ump"
description = "MIDI 2.0 devices: a Universal MIDI Packet client of the ALSA sequencer (Linux) and CoreMIDI (macOS)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
faderframe-realtime.workspace = true
faderframe-midi.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
alsa-sys = "0.4"
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
coremidi = "0.9"
# FaderFrame's own destination (`own_destination`): the versions coremidi
# uses.
coremidi-sys = "3.2"
block2 = "0.6"
core-foundation = "0.10"
