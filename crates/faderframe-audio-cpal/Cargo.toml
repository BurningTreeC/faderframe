[package]
name = "faderframe-audio-cpal"
description = "System audio backend through cpal: WASAPI (Windows), CoreAudio (macOS), ALSA (Linux)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Steinberg ASIO on Windows. Opt-in: building it needs the ASIO SDK
# (CPAL_ASIO_DIR, or downloaded by asio-sys) and LLVM/clang for bindgen, and
# the SDK's licence (Steinberg's or GPLv3) then applies to the binary.
asio = ["cpal/asio"]

[dependencies]
faderframe-audio.workspace = true
cpal.workspace = true
rtrb.workspace = true
tracing.workspace = true
