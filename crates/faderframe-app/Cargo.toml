[package]
name = "faderframe-app"
description = "FaderFrame application binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["gpu-painter"]
# Steinberg ASIO drivers on Windows (see faderframe-audio-cpal).
asio = ["faderframe-ui/asio"]
# The GPU painter for dense views.
gpu-painter = ["faderframe-ui/gpu-painter"]

[dependencies]
faderframe-plugin-clap.workspace = true
faderframe-plugin-vst3.workspace = true
faderframe-ui.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
faderframe-audio.workspace = true

[[bin]]
name = "faderframe"
path = "src/main.rs"
