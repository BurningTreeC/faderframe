name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev pkg-config libjack-jackd2-dev libasound2-dev xvfb \
            libpipewire-0.3-dev libclang-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Build application
        run: cargo build -p faderframe-app
      - name: GUI smoke test (headless X11)
        env:
          FADERFRAME_STARTUP_ACTIONS: detach-mixer,show-piano-roll,workspace-3,quit
        run: timeout 120 xvfb-run -a target/debug/faderframe --backend dummy
      - name: Third-party license inventory is current
        run: python3 scripts/third_party_licenses.py --check

  licenses:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
