name: Release

# Packages FaderFrame: a Flatpak bundle and a portable tarball (Linux),
# DMGs (macOS on Apple Silicon and Intel), an installer and a portable zip
# (Windows). A tag
# `v*` publishes them as a GitHub release; a manual run keeps them as
# workflow artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: FaderFrame-linux-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.BurningTreeC.FaderFrame.yml
          cache-key: flatpak-builder-${{ github.sha }}

  linux-tarball:
    name: Linux tarball
    # Build against Debian 13's glibc, then bundle GTK 4.22 and Wayland 1.24.
    # This keeps the recent renderer fixes without raising the host baseline.
    runs-on: ubuntu-24.04
    container: debian:13
    env:
      GTK_PREFIX: /opt/faderframe-gtk
      PKG_CONFIG_PATH: /opt/faderframe-gtk/lib/pkgconfig
      LD_LIBRARY_PATH: /opt/faderframe-gtk/lib
    steps:
      - name: System dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential pkg-config libjack-jackd2-dev libasound2-dev \
            libpipewire-0.3-dev libclang-dev librsvg2-common adwaita-icon-theme \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            libglib2.0-dev libglib2.0-bin libpango1.0-dev \
            libharfbuzz-dev libcairo2-dev libfribidi-dev libgdk-pixbuf-2.0-dev \
            libgraphene-1.0-dev libepoxy-dev libjpeg-dev libpng-dev libtiff-dev \
            libfontconfig1-dev libx11-dev libxext-dev libxrender-dev libxi-dev \
            libxrandr-dev libxcursor-dev libxdamage-dev libxfixes-dev libxinerama-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libvulkan-dev libdrm-dev \
            libegl-dev libgl-dev libgles-dev iso-codes gettext sassc glslc \
            meson ninja-build nasm curl xz-utils file binutils python3
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: /opt/faderframe-gtk
          key: linux-debian13-gtk-4.22.4-wayland-1.24.0-${{ hashFiles('packaging/linux/build-gtk.sh') }}
      - name: GTK 4.22 SDK
        run: packaging/linux/build-gtk.sh "$GTK_PREFIX"
      - name: GTK version
        run: |
          pkg-config --modversion gtk4 gstreamer-1.0
          pkg-config --atleast-version=4.22 gtk4
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.41"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release -p faderframe-app
      - name: LGPL FFmpeg decoders (ProRes, DNxHD, …)
        # GStreamer 1.26 supports the script's default FFmpeg 7.1.
        run: packaging/linux/lgpl_libav.sh "$RUNNER_TEMP/libav"
      - name: Portable tarball
        run: |
          FADERFRAME_LIBAV="$RUNNER_TEMP/libav" FADERFRAME_MAX_GLIBC=2.41 \
            packaging/linux/tarball.sh
          package=$(find dist -mindepth 1 -maxdepth 1 -type d -name 'faderframe-*-linux-*' -print -quit)
          test -n "$package"
          "$package/faderframe" --version
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: dist/*.tar.xz

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      # Use the runner image's package metadata and existing libraries.
      # Updating Homebrew selects newer formulae without Intel bottles,
      # rebuilding GTK/GStreamer and their toolchains from source for hours.
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_UPGRADE: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
    steps:
      - uses: actions/checkout@v5
      - name: System dependencies
        # Bottled dependencies took about two minutes on macos-15-intel.
        # Bound this step if a future runner image loses usable bottles.
        timeout-minutes: 15
        run: brew install gtk4 adwaita-icon-theme librsvg pkgconf gstreamer
      - name: GTK version
        run: |
          pkg-config --modversion gtk4 gstreamer-1.0
          # Keep the recent renderer fixes without upgrading every library.
          pkg-config --atleast-version=4.22 gtk4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release -p faderframe-app
      - name: App bundle and disk image
        run: packaging/macos/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # Upgrade MSYS2 packages before installing the latest GTK.
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-python
            zip
            unzip
      - name: GTK version
        run: pkg-config --modversion gtk4
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build
        run: cargo build --release -p faderframe-app
      - name: Folder, zip and installer
        run: packaging/windows/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe

  release:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [flatpak, linux-tarball, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l artifacts
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # The tag was moved: the release gets the new builds.
            gh release upload "$GITHUB_REF_NAME" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "FaderFrame ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
