<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43464e"/>
      <stop offset="1" stop-color="#1c1e23"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16171b"/>
      <stop offset="1" stop-color="#0e0f12"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="0.5" stop-color="#d9d4c9"/>
      <stop offset="1" stop-color="#a9a398"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="0.5" stop-color="#f3b44a"/>
      <stop offset="1" stop-color="#c9801f"/>
    </linearGradient>
    <linearGradient id="meter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4fd17d"/>
      <stop offset="0.7" stop-color="#e8d24a"/>
      <stop offset="1" stop-color="#ff5a4a"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="50" fill="url(#body)"/>
  <rect x="17" y="17" width="222" height="222" rx="49" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
  <rect x="38" y="38" width="180" height="180" rx="22" fill="url(#panel)"/>
  <rect x="38.5" y="38.5" width="179" height="179" rx="21.5" fill="none" stroke="#000000" stroke-opacity="0.5"/>
  <!-- fader slots -->
  <rect x="67" y="58" width="10" height="140" rx="5" fill="#030304"/>
  <rect x="123" y="58" width="10" height="140" rx="5" fill="#030304"/>
  <rect x="179" y="58" width="10" height="140" rx="5" fill="#030304"/>
  <!-- the middle strip's meter -->
  <rect x="153" y="98" width="6" height="100" rx="3" fill="url(#meter)"/>
  <!-- caps -->
  <g>
    <rect x="52" y="124" width="40" height="26" rx="6" fill="url(#cap)"/>
    <rect x="52" y="136" width="40" height="2.5" fill="#1a1a1a" fill-opacity="0.7"/>
  </g>
  <g>
    <rect x="108" y="80" width="40" height="26" rx="6" fill="url(#amber)"/>
    <rect x="108" y="92" width="40" height="2.5" fill="#3a2205" fill-opacity="0.8"/>
  </g>
  <g>
    <rect x="164" y="150" width="40" height="26" rx="6" fill="url(#cap)"/>
    <rect x="164" y="162" width="40" height="2.5" fill="#1a1a1a" fill-opacity="0.7"/>
  </g>
</svg>
