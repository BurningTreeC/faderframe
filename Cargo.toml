# --- external crates -------------------------------------------------------
# GUI shell (Linux first; GTK 4.14+ for GSK path rendering).
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
x11rb = { version = "0.14", default-features = false, features = ["randr"] }
glib-unix = "0.22"
windows-sys = "0.61"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std"] }
# Audio backends. `jack` loads libjack at runtime (dynamic_loading), so the
# application still starts on machines without JACK/pipewire-jack.
jack = "0.13"
cpal = "0.18"
pipewire = "0.10"
# Realtime-safe wait-free SPSC ring buffer used for control <-> RT messaging.
rtrb = "0.4"
# futex and thread scheduling for the DSP worker pool.
libc = "0.2"
midir = "0.11"
# Audio decoding (pure Rust; MPL-2.0, file-level copyleft, MIT-compatible).
symphonia = { version = "0.6", default-features = false, features = ["wav", "aiff", "caf", "flac", "mp3", "ogg", "vorbis", "isomp4", "aac", "alac", "pcm", "adpcm"] }
# High-quality sample-rate conversion.
rubato = "5"
# FFT for transient detection (already used by rubato).
realfft = "3"
midly = { version = "0.5", default-features = false, features = ["alloc", "std"] }
cc = "1.2"
audioadapter-buffers = "5"
# CLAP plugin hosting (MIT OR Apache-2.0).
clack-host = "0.2"
clack-extensions = { version = "0.2", features = ["clack-host", "audio-ports", "gui", "latency", "log", "note-ports", "params", "posix-fd", "render", "state", "tail", "thread-check", "timer"] }
clack-plugin = "0.2"
# VST3 hosting: bindings generated from the (MIT-licensed) VST 3 SDK headers
# (MIT OR Apache-2.0); bundles are loaded with libloading.
vst3 = "0.3"
libloading = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Video (demux, decode, encode, mux; the shell shows frames itself).
gst = { package = "gstreamer", version = "0.25" }
gst-app = { package = "gstreamer-app", version = "0.25" }
gst-video = { package = "gstreamer-video", version = "0.25" }
gst-pbutils = { package = "gstreamer-pbutils", version = "0.25" }
gst-allocators = { package = "gstreamer-allocators", version = "0.25" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Checksums of downloaded models (the publishers give MD5).
md-5 = "0.10"
# AES67 network audio: socket options std lacks (address reuse, multicast
# interface, DSCP) without unsafe code.
socket2 = { version = "0.6", features = ["all"] }
# Live collaboration: the Noise protocol (Noise_NNpsk0_25519_ChaChaPoly_SHA256,
# pure Rust, Apache-2.0 OR MIT; no `std` feature, which would pull in ring),
# MessagePack for what is sent (exact floats, self-describing), invite codes
# from the OS's randomness.
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
rmp-serde = "1.3"
rmpv = "1.3"
serde_bytes = "0.11"
sha2 = "0.10"
getrandom = "0.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
# `--cfg faderframe_check_only` (RUSTFLAGS): cross-checks without a target's
# SDK leave out what builds C with it (libopus).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(faderframe_check_only)"] }

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.dev]
# Keep DSP code usable in debug builds.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# The transcription model's convolutions are too slow unoptimised.
[profile.dev.package.faderframe-transcribe]
opt-level = 3

[profile.dev.package.faderframe-speech]
opt-level = 3

# Stem separation: LSTMs and Wiener filtering over whole recordings.
[profile.dev.package.faderframe-separate]
opt-level = 3

# Spectral edits and spectrograms: FFTs over whole clips.
[profile.dev.package.faderframe-spectral]
opt-level = 3

# HDR pictures are mapped per pixel as they are decoded.
[profile.dev.package.faderframe-video]
opt-level = 3

# The preamps' circuit solver: real time needs it optimised.
[profile.dev.package.faderframe-circuit]
opt-level = 3

[profile.dev.package.faderframe-guitar]
opt-level = 3

# Mix Intelligence and Auto-Align measure whole mixes: FFTs, true peaks,
# loudness over every tapped signal.
[profile.dev.package.faderframe-analysis]
opt-level = 3

[profile.dev.package.faderframe-mix-intelligence]
opt-level = 3

# The codec monitor resamples and codes the master in real time.
[profile.dev.package.faderframe-codec]
opt-level = 3

# The restoration devices run FFTs and AR fits on the audio thread.
[profile.dev.package.faderframe-restore]
opt-level = 3

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 4

[profile.bench-rt]
inherits = "release"
debug = true
