[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "MIT"
repository = "https://github.com/BurningTreeC/faderframe"

[workspace.dependencies]
# --- internal crates -------------------------------------------------------
faderframe-core = { path = "crates/faderframe-core" }
faderframe-timeline = { path = "crates/faderframe-timeline" }
faderframe-midi = { path = "crates/faderframe-midi" }
faderframe-midi-io = { path = "crates/faderframe-midi-io" }
faderframe-realtime = { path = "crates/faderframe-realtime" }
faderframe-stretch = { path = "crates/faderframe-stretch" }
faderframe-audio-graph = { path = "crates/faderframe-audio-graph" }
faderframe-transport = { path = "crates/faderframe-transport" }
faderframe-automation = { path = "crates/faderframe-automation" }
faderframe-workspace = { path = "crates/faderframe-workspace" }
faderframe-project = { path = "crates/faderframe-project" }
faderframe-audio = { path = "crates/faderframe-audio" }
faderframe-analysis = { path = "crates/faderframe-analysis" }
faderframe-audio-cpal = { path = "crates/faderframe-audio-cpal" }
faderframe-audio-jack = { path = "crates/faderframe-audio-jack" }
faderframe-audio-pipewire = { path = "crates/faderframe-audio-pipewire" }
faderframe-audio-files = { path = "crates/faderframe-audio-files" }
faderframe-plugin-host = { path = "crates/faderframe-plugin-host" }
faderframe-plugin-clap = { path = "crates/faderframe-plugin-clap" }
faderframe-plugin-vst3 = { path = "crates/faderframe-plugin-vst3" }
faderframe-plugin-sandbox = { path = "crates/faderframe-plugin-sandbox" }
faderframe-disc = { path = "crates/faderframe-disc" }
faderframe-plugin-au = { path = "crates/faderframe-plugin-au" }
faderframe-engine = { path = "crates/faderframe-engine" }
faderframe-session = { path = "crates/faderframe-session" }
faderframe-ui-canvas = { path = "crates/faderframe-ui-canvas" }
faderframe-view-arranger = { path = "crates/faderframe-view-arranger" }
faderframe-view-mixer = { path = "crates/faderframe-view-mixer" }
faderframe-view-tools = { path = "crates/faderframe-view-tools" }
faderframe-view-devices = { path = "crates/faderframe-view-devices" }
faderframe-view-automation = { path = "crates/faderframe-view-automation" }
faderframe-view-album = { path = "crates/faderframe-view-album" }
faderframe-view-performance = { path = "crates/faderframe-view-performance" }
faderframe-view-pianoroll = { path = "crates/faderframe-view-pianoroll" }
faderframe-ui = { path = "crates/faderframe-ui" }

# --- external crates -------------------------------------------------------
# GUI shell (Linux first; GTK 4.14+ for GSK path rendering).
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
x11rb = { version = "0.14", default-features = false, features = ["randr"] }
glib-unix = "0.22"
windows-sys = "0.61"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std"] }
# Audio backends. `jack` loads libjack at runtime (dynamic_loading), so the
# application still starts on machines without JACK/pipewire-jack.
jack = "0.13"
cpal = "0.18"
pipewire = "0.10"
# Realtime-safe wait-free SPSC ring buffer used for control <-> RT messaging.
rtrb = "0.4"
# futex and thread scheduling for the DSP worker pool.
libc = "0.2"
midir = "0.11"
# Audio decoding (pure Rust; MPL-2.0, file-level copyleft, MIT-compatible).
symphonia = { version = "0.6", default-features = false, features = ["wav", "aiff", "caf", "flac", "mp3", "ogg", "vorbis", "isomp4", "aac", "alac", "pcm", "adpcm"] }
# High-quality sample-rate conversion.
rubato = "5"
# FFT for transient detection (already used by rubato).
realfft = "3"
midly = { version = "0.5", default-features = false, features = ["alloc", "std"] }
cc = "1.2"
audioadapter-buffers = "5"
# CLAP plugin hosting (MIT OR Apache-2.0).
clack-host = "0.2"
clack-extensions = { version = "0.2", features = ["clack-host", "audio-ports", "gui", "latency", "log", "note-ports", "params", "posix-fd", "state", "tail", "thread-check", "timer"] }
clack-plugin = "0.2"
# VST3 hosting: bindings generated from the (MIT-licensed) VST 3 SDK headers
# (MIT OR Apache-2.0); bundles are loaded with libloading.
vst3 = "0.3"
libloading = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.dev]
# Keep DSP code usable in debug builds.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 4

[profile.bench-rt]
inherits = "release"
debug = true
